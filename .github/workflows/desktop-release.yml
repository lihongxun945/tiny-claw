name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      NOTARY_POLL_INTERVAL_SECONDS: "30"
      NOTARY_MAX_ATTEMPTS: "100"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Check release version
        run: node scripts/check-release-version.mjs

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci

      - name: Install system dependencies
        run: brew install ripgrep

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run tests
        run: npm run test:all

      - name: Test embedded Qwen model
        run: npm run test:local-model

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          certificate_path="${RUNNER_TEMP}/developer-id-application.p12"
          intermediate_path="${RUNNER_TEMP}/DeveloperIDG2CA.cer"
          keychain_path="${RUNNER_TEMP}/app-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          test -n "${MACOS_CERTIFICATE}"
          test -n "${MACOS_CERTIFICATE_PASSWORD}"
          printf '%s' "${MACOS_CERTIFICATE}" | base64 -D > "${certificate_path}"
          curl -fsSL \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "${intermediate_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12
          security import "${intermediate_path}" -k "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security find-identity -v -p codesigning "${keychain_path}"

          echo "SIGNING_KEYCHAIN=${keychain_path}" >> "${GITHUB_ENV}"

      - name: Build signed macOS DMG
        run: npm run desktop:dist

      - name: Smoke test packaged application
        run: npm run desktop:smoke

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          test -n "${APPLE_ID}"
          test -n "${APPLE_APP_SPECIFIC_PASSWORD}"
          test -n "${APPLE_TEAM_ID}"

          dmg_path="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "${dmg_path}"

          auth_args=(
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}"
          )

          submission_json="$(xcrun notarytool submit "${dmg_path}" \
            "${auth_args[@]}" \
            --output-format json)"
          submission_id="$(printf '%s' "${submission_json}" | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const id = JSON.parse(input).id;
              if (!id) process.exit(1);
              process.stdout.write(id);
            });
          ')"
          echo "Apple notarization submission: ${submission_id}"

          accepted=false
          for ((attempt = 1; attempt <= NOTARY_MAX_ATTEMPTS; attempt++)); do
            error_path="${RUNNER_TEMP}/notary-info-error.txt"
            if info_json="$(xcrun notarytool info "${submission_id}" \
              "${auth_args[@]}" \
              --output-format json 2>"${error_path}")"; then
              status="$(printf '%s' "${info_json}" | node -e '
                let input = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => { input += chunk; });
                process.stdin.on("end", () => process.stdout.write(JSON.parse(input).status ?? ""));
              ')"
              echo "Notarization status (${attempt}/${NOTARY_MAX_ATTEMPTS}): ${status}"
              if [[ "${status}" == "Accepted" ]]; then
                accepted=true
                break
              fi
              if [[ "${status}" == "Invalid" ]]; then
                xcrun notarytool log "${submission_id}" "${auth_args[@]}" || true
                exit 1
              fi
            else
              echo "::warning::Unable to query Apple notarization status; retrying."
              cat "${error_path}"
            fi

            if (( attempt < NOTARY_MAX_ATTEMPTS )); then
              sleep "${NOTARY_POLL_INTERVAL_SECONDS}"
            fi
          done

          if [[ "${accepted}" != "true" ]]; then
            echo "Apple notarization did not complete after ${NOTARY_MAX_ATTEMPTS} attempts." >&2
            xcrun notarytool log "${submission_id}" "${auth_args[@]}" || true
            exit 1
          fi

          xcrun stapler staple "${dmg_path}"
          xcrun stapler validate "${dmg_path}"

      - name: Verify signed release and generate checksum
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/tiny-claw.app
          hdiutil verify release/tiny-claw-*.dmg
          node scripts/release-checksums.mjs macos

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/SHA256SUMS-macos.txt

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -f "${SIGNING_KEYCHAIN}" ]]; then
            security delete-keychain "${SIGNING_KEYCHAIN}"
          fi

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
      - name: Check release version
        run: node scripts/check-release-version.mjs
      - name: Install dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix web ci
      - name: Install ripgrep
        run: choco install ripgrep --yes --no-progress
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run tests
        run: npm run test:all
      - name: Test embedded Qwen model
        run: npm run test:local-model
      - name: Build unsigned Windows installer
        run: npm run desktop:dist:win
      - name: Install and smoke test Windows application
        run: |
          $installer = (Get-ChildItem release/*-windows-x64-setup.exe).FullName
          $installPath = Join-Path $env:RUNNER_TEMP 'tiny-claw install'
          $result = Start-Process -FilePath $installer -ArgumentList "/S /currentuser /D=`"$installPath`"" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer failed: $($result.ExitCode)" }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $entries = @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object { $_.DisplayName -eq "tiny-claw $version" -and $_.DisplayVersion -eq $version })
          Write-Host "Requested installation directory: $installPath"
          $entries | Select-Object DisplayName, DisplayVersion, InstallLocation, UninstallString | Format-List
          if ($entries.Count -ne 1) { throw "Expected one current-user installation, found $($entries.Count)" }
          $actualPath = (Get-ItemProperty "HKCU:\Software\$($entries[0].PSChildName)").InstallLocation
          Write-Host "Registered installation directory: $actualPath"
          if (!$actualPath) { throw 'Installation registry entry has no InstallLocation' }
          Get-ChildItem -LiteralPath $actualPath | Select-Object Name, Length | Format-Table
          try {
            if ([IO.Path]::GetFullPath($actualPath).TrimEnd('\') -ne [IO.Path]::GetFullPath($installPath).TrimEnd('\')) {
              throw "Installation directory mismatch: expected '$installPath', actual '$actualPath'"
            }
            if (!(Test-Path "$installPath/tiny-claw.exe")) { throw 'Installed application missing' }
            npm run desktop:smoke -- "$installPath"
            if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke test failed' }
          } finally {
            $uninstaller = (Get-ChildItem "$actualPath/Uninstall*.exe").FullName
            $removed = Start-Process -FilePath $uninstaller -ArgumentList "/S /currentuser _?=$actualPath" -Wait -PassThru
            if ($removed.ExitCode -ne 0) { throw "Uninstaller failed: $($removed.ExitCode)" }
            if (Test-Path "$actualPath/tiny-claw.exe") { throw 'Uninstaller did not remove the application' }
          }
      - name: Generate Windows checksum
        run: node scripts/release-checksums.mjs windows
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          if-no-files-found: error
          path: |
            release/*-windows-x64-setup.exe
            release/*.exe.blockmap
            release/SHA256SUMS-windows.txt

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --verify-tag --generate-notes \
            --title "tiny-claw ${GITHUB_REF_NAME}" \
            --notes "Windows x64 installer is unsigned. macOS ARM64 DMG is signed and notarized."
