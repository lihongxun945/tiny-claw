name: Release macOS DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      NOTARY_POLL_INTERVAL_SECONDS: "30"
      NOTARY_MAX_ATTEMPTS: "100"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Check release version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${package_version}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci

      - name: Install system dependencies
        run: brew install ripgrep

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run tests
        run: |
          npm run typecheck
          npm run web:build
          npm test
          npm run test:e2e

      - name: Test embedded Qwen model
        run: npm run test:local-model

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          certificate_path="${RUNNER_TEMP}/developer-id-application.p12"
          intermediate_path="${RUNNER_TEMP}/DeveloperIDG2CA.cer"
          keychain_path="${RUNNER_TEMP}/app-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          test -n "${MACOS_CERTIFICATE}"
          test -n "${MACOS_CERTIFICATE_PASSWORD}"
          printf '%s' "${MACOS_CERTIFICATE}" | base64 -D > "${certificate_path}"
          curl -fsSL \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "${intermediate_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12
          security import "${intermediate_path}" -k "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security find-identity -v -p codesigning "${keychain_path}"

          echo "SIGNING_KEYCHAIN=${keychain_path}" >> "${GITHUB_ENV}"

      - name: Build signed macOS DMG
        run: npm run desktop:dist

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          test -n "${APPLE_ID}"
          test -n "${APPLE_APP_SPECIFIC_PASSWORD}"
          test -n "${APPLE_TEAM_ID}"

          dmg_path="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "${dmg_path}"

          auth_args=(
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}"
          )

          submission_json="$(xcrun notarytool submit "${dmg_path}" \
            "${auth_args[@]}" \
            --output-format json)"
          submission_id="$(printf '%s' "${submission_json}" | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const id = JSON.parse(input).id;
              if (!id) process.exit(1);
              process.stdout.write(id);
            });
          ')"
          echo "Apple notarization submission: ${submission_id}"

          accepted=false
          for ((attempt = 1; attempt <= NOTARY_MAX_ATTEMPTS; attempt++)); do
            error_path="${RUNNER_TEMP}/notary-info-error.txt"
            if info_json="$(xcrun notarytool info "${submission_id}" \
              "${auth_args[@]}" \
              --output-format json 2>"${error_path}")"; then
              status="$(printf '%s' "${info_json}" | node -e '
                let input = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => { input += chunk; });
                process.stdin.on("end", () => process.stdout.write(JSON.parse(input).status ?? ""));
              ')"
              echo "Notarization status (${attempt}/${NOTARY_MAX_ATTEMPTS}): ${status}"
              if [[ "${status}" == "Accepted" ]]; then
                accepted=true
                break
              fi
              if [[ "${status}" == "Invalid" ]]; then
                xcrun notarytool log "${submission_id}" "${auth_args[@]}" || true
                exit 1
              fi
            else
              echo "::warning::Unable to query Apple notarization status; retrying."
              cat "${error_path}"
            fi

            if (( attempt < NOTARY_MAX_ATTEMPTS )); then
              sleep "${NOTARY_POLL_INTERVAL_SECONDS}"
            fi
          done

          if [[ "${accepted}" != "true" ]]; then
            echo "Apple notarization did not complete after ${NOTARY_MAX_ATTEMPTS} attempts." >&2
            xcrun notarytool log "${submission_id}" "${auth_args[@]}" || true
            exit 1
          fi

          xcrun stapler staple "${dmg_path}"
          xcrun stapler validate "${dmg_path}"

      - name: Verify signed release and generate checksum
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/tiny-claw.app
          hdiutil verify release/tiny-claw-*.dmg
          shasum -a 256 release/tiny-claw-*.dmg > release/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/tiny-claw-*.dmg \
            release/tiny-claw-*.dmg.blockmap \
            release/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "tiny-claw ${GITHUB_REF_NAME}"

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -f "${SIGNING_KEYCHAIN}" ]]; then
            security delete-keychain "${SIGNING_KEYCHAIN}"
          fi
